# Render Blueprint — provisions every CE 2.0 service from one file.
# In Render: New > Blueprint > connect the ce-2.0 repo. Render reads this file.
# Free plan note: services spin down after ~15 min idle (30-60s cold start).
#
# Cross-service URLs are `sync: false` — Render won't fill them from this file.
# After the FIRST deploy, copy each service's public URL from the dashboard
# and paste it into the env vars marked below, then redeploy. See docs/DEPLOY.md.

services:
  - type: web
    name: ce2-directory
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @ce2/directory... build
    startCommand: pnpm --filter @ce2/directory start
    healthCheckPath: /health
    autoDeploy: true

  - type: web
    name: ce2-broker
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @ce2/broker... build
    startCommand: pnpm --filter @ce2/broker start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DIRECTORY_URL          # paste ce2-directory public URL after first deploy
        sync: false

  - type: web
    name: ce2-referral-intake
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @ce2/referral-intake... build
    startCommand: pnpm --filter @ce2/referral-intake start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DIRECTORY_URL          # paste ce2-directory public URL
        sync: false
      - key: BROKER_URL             # paste ce2-broker public URL
        sync: false

  - type: web
    name: ce2-portal
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @ce2/portal... build
    startCommand: pnpm --filter @ce2/portal start
    autoDeploy: true
    envVars:
      # NEXT_PUBLIC_* are baked at build time — set these before/at first build,
      # then redeploy once the API URLs are known.
      - key: NEXT_PUBLIC_DIRECTORY_URL        # paste ce2-directory public URL
        sync: false
      - key: NEXT_PUBLIC_REFERRAL_INTAKE_URL  # paste ce2-referral-intake public URL
        sync: false
